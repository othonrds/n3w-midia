<!doctype html><meta charset="utf-8"><title>n3w bridge</title><body>ponte</body>
<script>
(async()=>{
 const base=location.origin+'/m/fotosadv/criativos/';
 const list=[['TOMAS-R1/r1-pov-fotografo.mp4','R1_pov-fotografo.mp4'],['TOMAS-R2/r2-revelacao-rapida.mp4','R2_revelacao-rapida.mp4'],['TOMAS-R3/r3-foto-comum-campanha.mp4','R3_foto-comum-campanha.mp4']];
 const files=[];
 for(const [p,n] of list){const b=await (await fetch(base+p)).blob(); files.push({name:n,blob:b});}
 if(window.opener){window.opener.postMessage({n3w:true,files},'https://github.com');}
 document.body.textContent='enviado '+files.length;
})();
</script>
