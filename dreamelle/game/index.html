/* Dreamelle MVP v0.2 — styles. Layout unit: rem is tied to the viewport so 844×390 and 1280×720 both get ~63rem of width. */
:root{
  --pink:#ff5fa8; --pink2:#ff8cc4; --pink3:#ffd3e8; --pink4:#fff0f7;
  --lilac:#a98bf5; --lilac2:#d9cbff; --gold:#e8b44c; --gold2:#ffe3a3;
  --ink:#4a2547; --ink2:#7d5a7a; --white:#fff; --ok:#3bbf7a; --bad:#ef5b6e;
  --card:rgba(255,255,255,.86); --card2:rgba(255,255,255,.66);
  --shadow:0 .5rem 1.6rem rgba(155,48,120,.22);
  --r:1.1rem;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --fd:'Fredoka','Nunito',system-ui,sans-serif; --fs:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(11px,min(3.4vh,1.58vw),22px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:#ffd9ec;color:var(--ink);font-family:var(--fs);
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,#ffe3f1,#f1e6ff)}
.screen{position:absolute;inset:0;overflow:hidden;animation:fadeIn .35s ease both}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.bg::after{content:"";position:absolute;inset:0}
.layer{position:absolute;inset:0;z-index:1;padding:calc(.7rem + var(--st)) calc(.9rem + var(--sr)) calc(.7rem + var(--sb)) calc(.9rem + var(--sl))}
.bg-splash{background-image:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/c17df7f8-3a39-457a-9743-0da28e8c7c41.webp)}
.bg-splash::after{background:linear-gradient(100deg,rgba(255,226,242,.92) 0%,rgba(255,210,236,.72) 45%,rgba(220,200,255,.35) 100%)}
.bg-home{background-image:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/c17df7f8-3a39-457a-9743-0da28e8c7c41.webp)}
.bg-home::after{background:linear-gradient(180deg,rgba(255,220,240,.18),rgba(255,200,230,.08) 60%,rgba(120,40,100,.18))}
.bg-bed{background-image:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/7a741c7e-2157-46fe-9926-b12b110bc429.webp);filter:saturate(1.05)}
.bg-bed::after{background:linear-gradient(120deg,rgba(255,236,246,.78),rgba(240,225,255,.6))}
.bg-map{background-image:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/1b6c984a-a46b-4094-ab51-cc5909dc2bd7.webp)}
.bg-map::after{background:linear-gradient(180deg,rgba(70,20,80,.25),transparent 22%,transparent 80%,rgba(70,20,80,.2))}
.bg-law{background-image:url(https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/f1b4ccf6-c051-4861-80d2-ec56bb378d4e.webp);background-position:center 30%}
.bg-law::after{background:linear-gradient(90deg,rgba(255,235,246,.25),rgba(80,30,90,.15))}
.bg-soft{background:radial-gradient(120% 120% at 20% 10%,#fff3fa 0%,#ffd6eb 45%,#e7d6ff 100%)}

/* ---------- typography ---------- */
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:600;letter-spacing:.01em}
.title{font-family:var(--fd);font-weight:600;font-size:1.5rem;color:var(--ink)}
.sub{color:var(--ink2);font-size:.95rem}
.small{font-size:.8rem;color:var(--ink2)}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;min-width:44px;
  padding:.55rem 1.4rem;border-radius:999px;font-family:var(--fd);font-weight:600;font-size:1.1rem;color:#fff;
  background:linear-gradient(180deg,#ff8cc6 0%,#ff4f9e 100%);
  box-shadow:0 .35rem 0 #d93c86,0 .6rem 1.2rem rgba(255,79,158,.35),inset 0 .15rem 0 rgba(255,255,255,.55);
  text-shadow:0 1px 0 rgba(160,20,90,.35);transition:transform .12s,filter .12s}
.btn::before{content:"";position:absolute;left:14%;right:14%;top:6%;height:34%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(.2rem);box-shadow:0 .15rem 0 #d93c86,inset 0 .15rem 0 rgba(255,255,255,.5)}
.btn.big{font-size:1.4rem;padding:.7rem 2.2rem}
.btn.gold{background:linear-gradient(180deg,#ffe08a,#f0a83a);box-shadow:0 .35rem 0 #c7842a,0 .6rem 1.2rem rgba(240,168,58,.35),inset 0 .15rem 0 rgba(255,255,255,.6);color:#5a3200;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.lilac{background:linear-gradient(180deg,#c3abff,#8d6cf0);box-shadow:0 .35rem 0 #6c4fcf,0 .6rem 1.2rem rgba(141,108,240,.35),inset 0 .15rem 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 .25rem 0 rgba(200,120,170,.35),var(--shadow);text-shadow:none}
.btn.ghost::before{display:none}
.btn[disabled],.btn.off{filter:grayscale(.7) opacity(.65);pointer-events:none}
.btn svg{width:1.2em;height:1.2em;flex:none}
.icon-btn{width:max(44px,2.9rem);height:max(44px,2.9rem);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);box-shadow:var(--shadow);color:var(--pink)}
.icon-btn svg{width:55%;height:55%}
.linkbtn{min-height:44px;padding:0 .8rem;border-radius:999px;background:rgba(255,255,255,.7);color:var(--ink2);text-decoration:underline;font-size:.85rem}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.9);border-radius:999px;padding:.25rem .8rem .25rem .3rem;font-weight:800;font-size:.95rem;box-shadow:0 .2rem .6rem rgba(150,40,110,.18);min-height:2.1rem;white-space:nowrap}
.pill i{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%}
.pill i svg{width:1.1rem;height:1.1rem}
.i-coin{background:linear-gradient(180deg,#ffe08a,#f0a83a);color:#8a5200}
.i-gem{background:linear-gradient(180deg,#ffb3d9,#ff5fa8);color:#fff}
.i-bolt{background:linear-gradient(180deg,#c3abff,#8d6cf0);color:#fff}
.i-rep{background:linear-gradient(180deg,#a8e6cf,#3bbf7a);color:#fff}

/* ---------- HUD ---------- */
.hud{position:absolute;z-index:5;top:calc(.55rem + var(--st));left:calc(.7rem + var(--sl));right:calc(.7rem + var(--sr));display:flex;align-items:center;gap:.6rem;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .who{display:flex;align-items:center;gap:.55rem;background:rgba(255,255,255,.9);border-radius:999px;padding:.2rem 1rem .2rem .2rem;box-shadow:var(--shadow)}
.avatar{width:2.9rem;height:2.9rem;border-radius:50%;overflow:hidden;background:linear-gradient(180deg,#ffd9ec,#e7d6ff);border:2px solid #fff;box-shadow:0 0 0 2px var(--pink2);flex:none}
.avatar svg{width:100%;height:100%;display:block}
.who .nm{font-family:var(--fd);font-weight:600;font-size:.95rem;line-height:1.05;max-width:8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .lv{display:flex;align-items:center;gap:.4rem;font-size:.75rem;font-weight:800;color:var(--ink2)}
.bar{position:relative;display:block;height:.6rem;width:5.5rem;border-radius:9px;background:#f1dbe9;overflow:hidden}
.bar b{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,var(--pink2),var(--pink));transition:width .6s ease}
.hud .res{display:flex;gap:.45rem;margin-left:auto}
.hud .spacer{flex:1}

/* left rail */
.rail{position:absolute;z-index:4;left:calc(.7rem + var(--sl));top:4.4rem;display:flex;flex-direction:column;gap:.5rem}
.rail button{width:max(48px,3.6rem);min-height:max(48px,3.6rem);border-radius:1rem;background:rgba(255,255,255,.88);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.7rem;font-weight:800;color:var(--ink)}
.rail button svg{width:1.5rem;height:1.5rem;color:var(--pink)}
.rail button.hl{animation:pulse 1.6s infinite}

/* ---------- splash ---------- */
.splash .layer{display:flex;align-items:center}
.splash .left{flex:1.15;display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;padding-left:2.2rem}
.logo{font-family:var(--fd);font-weight:700;font-size:5.4rem;line-height:.95;letter-spacing:-.01em;position:relative;
  background:linear-gradient(180deg,#ff8ec7 0%,#ff4f9e 55%,#b06cf0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .2rem 0 #fff) drop-shadow(0 .45rem .8rem rgba(200,60,140,.35))}
.logo .spark{position:absolute;width:1.6rem;height:1.6rem;color:var(--gold);filter:drop-shadow(0 0 .3rem #fff)}
.logo .spark.a{right:-1.4rem;top:-.4rem}.logo .spark.b{left:2.9rem;top:-.9rem;width:1rem;height:1rem}
.tagline{font-family:var(--fd);font-size:1.55rem;color:var(--ink);font-weight:500;letter-spacing:.02em}
.tagline em{font-style:normal;color:var(--pink)}
.splash .right{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.splash .right .doll{height:96%;position:relative;z-index:1;filter:drop-shadow(0 .5rem .8rem rgba(150,40,110,.25))}
.splash .halo{position:absolute;bottom:4%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,214,235,.5) 45%,transparent 70%)}
.foot{position:absolute;z-index:3;bottom:calc(.2rem + var(--sb));left:calc(1rem + var(--sl));right:calc(1rem + var(--sr));display:flex;justify-content:space-between;align-items:center}
.version{font-size:.75rem;color:var(--ink2)}

/* ---------- onboarding ---------- */
.onb .layer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
.onb-card{width:40rem;max-width:92%;display:flex;gap:1.5rem;align-items:center;padding:1.4rem 1.8rem;animation:pop .4s ease both}
.onb-art{width:9rem;height:9rem;flex:none;border-radius:1.6rem;display:grid;place-items:center;background:linear-gradient(160deg,#ffd3e8,#e3d4ff);box-shadow:inset 0 .3rem .8rem rgba(255,255,255,.8)}
.onb-art svg{width:80%;height:80%}
.onb-card h2{font-size:1.8rem;margin-bottom:.4rem}
.onb-card p{margin:0;font-size:1.05rem;line-height:1.4;color:var(--ink2)}
.dots{display:flex;gap:.5rem}
.dots i{width:.7rem;height:.7rem;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 0 2px var(--pink3)}
.dots i.on{background:var(--pink);width:1.8rem;border-radius:9px}
.onb .row{display:flex;gap:1rem;align-items:center}

/* ---------- character ---------- */
.char .layer{display:flex;gap:1rem;align-items:stretch}
.char .stage{flex:0 0 36%;position:relative;display:flex;align-items:flex-end;justify-content:center}
.char .stage .doll{height:100%;position:relative;z-index:1;filter:drop-shadow(0 .5rem .8rem rgba(150,40,110,.25))}
.pedestal{position:absolute;bottom:0;width:72%;height:12%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#fff,#ffc4e1 60%,rgba(255,180,220,0) 72%)}
.char .panel{flex:1;display:flex;flex-direction:column;gap:.35rem;padding:.7rem 1.1rem}
.char .head{display:flex;align-items:center;gap:.6rem}
.char .head .title{flex:1}
.opt{display:flex;align-items:center;gap:.6rem;min-height:44px}
.opt>label,.opt>.lab{flex:0 0 6.2rem;font-weight:800;font-size:.9rem;color:var(--ink2)}
.opt .choices{display:flex;flex-wrap:wrap;gap:.4rem;flex:1}
.sw{width:max(44px,2.7rem);height:max(44px,2.7rem);border-radius:50%;border:3px solid #fff;box-shadow:0 .15rem .5rem rgba(120,40,100,.25);position:relative}
.sw.sel{box-shadow:0 0 0 3px var(--pink),0 .2rem .6rem rgba(255,79,158,.4)}
.sw.sel::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(255,255,255,.85)}
.chip{min-height:44px;min-width:44px;padding:.3rem .8rem;border-radius:999px;background:#fff;border:2px solid var(--pink3);font-weight:800;font-size:.9rem;color:var(--ink);display:inline-flex;align-items:center;gap:.35rem}
.chip.sel{background:linear-gradient(180deg,#ff9ccd,#ff5fa8);color:#fff;border-color:#fff;box-shadow:0 .2rem .6rem rgba(255,79,158,.4)}
.namein{flex:1;min-height:44px;border-radius:999px;border:2px solid var(--pink3);padding:.4rem 1rem;font-size:1.05rem;font-weight:700;color:var(--ink);background:#fff;outline:none;-webkit-user-select:text;user-select:text}
.namein:focus{border-color:var(--pink)}
.namein.err{border-color:var(--bad);animation:shake .35s}
.char .actions{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:.8rem}
.errtxt{color:var(--bad);font-weight:800;font-size:.85rem}

/* ---------- career ---------- */
.career .layer{display:flex;flex-direction:column;gap:.6rem}
.topbar{display:flex;align-items:center;gap:.7rem;min-height:44px}
.topbar .title{flex:1}
.cgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:.6rem;min-height:0}
.ccard{position:relative;border-radius:1rem;overflow:hidden;background:var(--card);border:2px solid #fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;padding:.4rem;text-align:center;min-height:44px}
.ccard .em{width:3.6rem;height:3.6rem;border-radius:1rem;display:grid;place-items:center;color:#fff;box-shadow:inset 0 .25rem .4rem rgba(255,255,255,.45),0 .25rem .6rem rgba(120,40,100,.2)}
.ccard .em svg{width:58%;height:58%}
.ccard b{font-family:var(--fd);font-weight:600;font-size:1.1rem}
.ccard span{font-size:.75rem;color:var(--ink2);line-height:1.15}
.ccard.locked{filter:saturate(.35);opacity:.82}
.ccard .soon{position:absolute;top:.45rem;right:.45rem;background:var(--lilac);color:#fff;font-size:.62rem;font-weight:900;padding:.15rem .55rem;border-radius:999px;letter-spacing:.04em}
.ccard .lock{position:absolute;top:.4rem;left:.4rem;width:1.4rem;height:1.4rem;color:var(--ink2)}
.ccard.play{background:linear-gradient(180deg,#fff,#ffe6f3)}
.ccard.sel{box-shadow:0 0 0 3px var(--pink),0 .6rem 1.4rem rgba(255,79,158,.45);transform:translateY(-.15rem)}
.ccard .tag{margin-top:.15rem;background:var(--ok);color:#fff;font-size:.66rem;font-weight:900;border-radius:999px;padding:.1rem .6rem}

/* ---------- home ---------- */
.home .dollwrap{position:absolute;z-index:2;left:47%;bottom:0;height:86%;filter:drop-shadow(0 .6rem .8rem rgba(100,30,80,.35))}
.home .dollwrap .doll{height:100%}
.goals{position:absolute;z-index:3;right:calc(.8rem + var(--sr));top:4.2rem;width:17.5rem;padding:.75rem .95rem}
.goals h3{font-size:1.15rem;display:flex;align-items:center;gap:.4rem}
.goals h3>svg{width:1.3rem;height:1.3rem;color:var(--gold);flex:none}
.goals .daytag{margin-left:auto;font-family:var(--fs);font-size:.72rem;font-weight:900;color:#fff;background:var(--lilac);border-radius:999px;padding:.12rem .6rem}
.goals ul{list-style:none;padding:0;margin:.45rem 0 0;display:flex;flex-direction:column;gap:.28rem}
.goals li{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:.95rem}
.goals li .cb{width:1.35rem;height:1.35rem;border-radius:.4rem;border:2px solid var(--pink2);display:grid;place-items:center;flex:none;background:#fff}
.goals li.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.goals li.done span{color:var(--ink2);text-decoration:line-through}
.goals li .cb svg{width:.9rem;height:.9rem}
.goals li.next span{color:var(--pink)}
.home .cta{position:absolute;z-index:3;right:calc(.9rem + var(--sr));bottom:calc(.9rem + var(--sb));display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.hint{background:rgba(74,37,71,.82);color:#fff;font-weight:800;font-size:.85rem;padding:.35rem .8rem;border-radius:999px;box-shadow:var(--shadow)}
.careerbadge{position:absolute;z-index:3;left:calc(5.3rem + var(--sl));bottom:calc(.8rem + var(--sb));display:flex;align-items:center;gap:.45rem;padding:.35rem .9rem .35rem .4rem;border-radius:999px;font-weight:800;font-size:.85rem}
.careerbadge i{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#c3abff,#8d6cf0);color:#fff}
.careerbadge i svg{width:1.1rem;height:1.1rem}
.teaser{position:absolute;z-index:3;right:calc(.8rem + var(--sr));top:4.2rem;width:17.5rem;padding:.8rem 1rem;text-align:left}
.teaser .lockbig{width:2.4rem;height:2.4rem;color:var(--lilac)}

/* ---------- map ---------- */
.mapbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:420/186;width:max(100vw,calc(100vh*420/186));z-index:0}
.mapbox .bg{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2;min-width:44px;min-height:44px}
.pin .ic{width:3.1rem;height:3.1rem;border-radius:50% 50% 50% 50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;box-shadow:0 .35rem .8rem rgba(60,10,60,.4),inset 0 .3rem .4rem rgba(255,255,255,.45)}
.pin .ic svg{width:55%;height:55%}
.pin .lb{margin-top:-.3rem;background:#fff;border-radius:999px;padding:.12rem .7rem;font-family:var(--fd);font-weight:600;font-size:.88rem;box-shadow:0 .25rem .6rem rgba(60,10,60,.3);white-space:nowrap;display:flex;align-items:center;gap:.25rem}
.pin .lb small{font-family:var(--fs);font-weight:900;font-size:.62rem;color:#fff;background:var(--ink2);border-radius:999px;padding:0 .35rem}
.pin.locked .ic{filter:saturate(.25) brightness(.95)}
.pin.locked .ic::after{content:"";position:absolute}
.pin .lk{position:absolute;top:-.2rem;right:-.3rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink2);box-shadow:0 .1rem .3rem rgba(0,0,0,.2)}
.pin .lk svg{width:.8rem;height:.8rem}
.pin.go .ic{animation:bob 1.2s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.6),0 0 1.4rem .4rem rgba(255,95,168,.8)}
.pin.go .lb{background:var(--pink);color:#fff}
.mapchip{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.92);border-radius:999px;padding:.25rem .9rem;font-family:var(--fd);font-weight:600;box-shadow:var(--shadow);min-height:2.4rem}
.mapchip svg{width:1.1rem;height:1.1rem;color:var(--pink)}
.maphint{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(.8rem + var(--sb))}

/* ---------- law firm ---------- */
.law .dollwrap{position:absolute;z-index:2;left:7%;bottom:0;height:84%;filter:drop-shadow(0 .6rem .8rem rgba(60,20,70,.35))}
.law .dollwrap .doll{height:100%}
.desk{position:absolute;z-index:3;left:0;bottom:0;width:44%;height:22%;background:linear-gradient(180deg,#f7e5d6,#e5c8b3);border-top-right-radius:1.2rem;box-shadow:0 -.3rem 1rem rgba(80,30,60,.25)}
.desk::before{content:"";position:absolute;left:30%;top:-1.9rem;width:7rem;height:2.1rem;border-radius:.4rem .4rem 0 0;background:linear-gradient(180deg,#e9e3ee,#c8bfd3);box-shadow:inset 0 0 0 .2rem #f5f1f8}
.desk::after{content:"";position:absolute;left:8%;top:-1.1rem;width:4rem;height:1.2rem;border-radius:.2rem;background:repeating-linear-gradient(180deg,#b14a7e 0 .35rem,#f2d6a6 .35rem .45rem,#6a4fa8 .45rem .8rem,#f2d6a6 .8rem .9rem)}
.workpanel{position:absolute;z-index:4;right:calc(.8rem + var(--sr));top:4.2rem;bottom:calc(.8rem + var(--sb));width:min(30rem,52%);padding:.8rem 1rem;display:flex;flex-direction:column;gap:.55rem}
.job{display:flex;gap:.75rem;align-items:center;padding:.6rem .7rem;border-radius:1rem;background:#fff;border:2px solid var(--pink3)}
.job.done{opacity:.7}
.job.next{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,168,.25)}
.job .jic{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;flex:none;color:#fff}
.job .jic svg{width:58%;height:58%}
.job .txt{flex:1;min-width:0}
.job .txt b{font-family:var(--fd);font-weight:600;font-size:1.05rem;display:block}
.job .txt span{font-size:.78rem;color:var(--ink2)}
.rw{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.2rem}
.rw em{font-style:normal;font-size:.7rem;font-weight:900;border-radius:999px;padding:.05rem .45rem;background:var(--pink4);color:var(--pink)}
.rw em.g{background:#fff4dc;color:#a76a00}.rw em.l{background:#f1eaff;color:#7652d6}
.job .btn{font-size:.95rem;padding:.4rem 1rem}
.donebadge{display:flex;align-items:center;gap:.25rem;color:var(--ok);font-weight:900;font-size:.85rem}
.donebadge svg{width:1.1rem;height:1.1rem}

/* case */
.casepanel{position:absolute;z-index:4;right:calc(.8rem + var(--sr));top:4.2rem;bottom:calc(.7rem + var(--sb));width:min(36rem,60%);padding:.8rem 1.1rem;display:flex;flex-direction:column;gap:.45rem}
.casepanel .kicker{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac)}
.casepanel h2{font-size:1.35rem}
.casepanel .sit{margin:0;font-size:.88rem;line-height:1.35;color:var(--ink2);background:var(--pink4);border-radius:.8rem;padding:.4rem .7rem}
.casepanel .q{font-weight:900;font-size:1rem}

function fresh(){
  return {v:2, created:false, name:'', av:{look:0,skin:1,hair:0,style:'long',outfit:'casual'}, career:null,
    level:1, xp:0, coins:200, gems:15, energy:10, maxEnergy:10, rep:0, caseWins:0,
    skills:{communication:1,logic:1,confidence:1,style:1},
    day:1, dayStarted:false, day1Done:false,
    goals:{work:false,case:false,skill:false,home:false},
    missions:{clause:false,organize:false},
    dayStats:{xp:0,coins:0,rep:0,cases:0,startLevel:1},
    settings:{music:true,sfx:true,reducedMotion:false,lang:'en'},
    onbDone:false};
}
let S = fresh();
function load(){
  const raw = store.get(SAVE_KEY);
  if(!raw) return;
  try{ const d = JSON.parse(raw); if(d && d.v===2){ const f=fresh(); S = Object.assign(f,d); S.settings=Object.assign(f.settings,d.settings||{}); S.goals=Object.assign(f.goals,d.goals||{}); S.skills=Object.assign(f.skills,d.skills||{}); S.av=Object.assign(f.av,d.av||{}); S.missions=Object.assign(f.missions,d.missions||{}); S.dayStats=Object.assign(f.dayStats,d.dayStats||{}); } }catch(e){}
}
function save(){ store.set(SAVE_KEY, JSON.stringify(S)); }

/* ===== Progression ===== */
const xpNeed = l => 100 + (l-1)*60;
function addXP(n){
  S.xp += n; S.dayStats.xp += n; let ups=0;
  while(S.xp >= xpNeed(S.level)){ S.xp -= xpNeed(S.level); S.level++; ups++; S.gems += 5; }
  return ups;
}
function addCoins(n){ S.coins += n; if(n>0) S.dayStats.coins += n; }
function nextGoal(){
  if(!S.dayStarted) return 'start';
  if(!S.goals.work) return 'work';
  if(!S.goals.case) return 'case';
  if(!S.goals.skill) return 'skill';
  if(!S.goals.home) return 'home';
  return S.day1Done ? 'locked' : 'end';
}
function startDay(){
  if(S.dayStarted) return;
  S.dayStarted = true; S.dayStats = {xp:0,coins:0,rep:0,cases:0,startLevel:S.level}; save();
}

/* ===== Audio (WebAudio, generated — no files) ===== */
let AC=null, musicTimer=null, musicStep=0;
function ac(){ if(!AC){ try{ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }catch(e){} } return AC; }
function tone(freq, dur, type, vol, when){
  const a=ac(); if(!a) return;
  try{
    const t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function sfx(k){
  if(!S.settings.sfx) return;
  if(k==='tap') tone(880,.08,'sine',.05);
  else if(k==='coin'){ tone(988,.1,'square',.03); tone(1319,.18,'square',.03,.08); }
  else if(k==='win'){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.1)); }
  else if(k==='bad') { tone(220,.18,'sawtooth',.03); tone(180,.2,'sawtooth',.03,.1); }
  else if(k==='ok') { tone(784,.1,'triangle',.06); tone(1175,.16,'triangle',.06,.07); }
}
const SONG=[[523,659,784],[440,523,659],[349,440,523],[392,494,587]];
function musicTick(){
  const a=ac(); if(!a||!S.settings.music) return;
  const ch=SONG[Math.floor(musicStep/8)%SONG.length], n=musicStep%8;
  const f=ch[[0,1,2,1,0,2,1,2][n]]*(n%4===0?.5:1);
  tone(f,.5,'sine',.025); if(n===0) tone(ch[0]/2,1.6,'triangle',.02);
  musicStep++;
}
function music(on){
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
  if(on && S.settings.music && ac()){ try{ AC.resume(); }catch(e){} musicTimer=setInterval(musicTick,260); }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) music(false); else if(audioArmed) music(true); });
let audioArmed=false;
document.addEventListener('pointerdown',()=>{ if(!audioArmed){ audioArmed=true; music(true); } },{capture:true});

}
function rm(){ return S.settings.reducedMotion || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }
function applySettings(){ document.documentElement.classList.toggle('rm', !!S.settings.reducedMotion); }
function confetti(){
  if(rm()) return;
  const c=document.createElement('div'); c.className='confetti';
  const cols=['#ff5fa8','#ffd3e8','#a98bf5','#e8b44c','#fff','#7fc4ff'];
  for(let i=0;i<46;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'%'; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.4)+'s'; p.style.transform=`rotate(${Math.random()*180}deg)`; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(()=>c.remove(),3800);
}
function countUp(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, pre=el.dataset.pre||'';
    if(rm()){ el.textContent=pre+to; return; }
    const t0=performance.now(), d=900;
    const step=t=>{ const k=Math.min(1,(t-t0)/d); el.textContent=pre+Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ===== Organize minigame ===== */
let caseAttempts=0, org=null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startOrganize(){
  org={left:45, filed:0, correct:0, sel:null, over:false, counts:{contracts:0,evidence:0,emails:0}};
  const tick=setInterval(()=>{
    if(org.over) return;
    org.left--; const s=$('#tsec'), b=$('#tbar'), t=$('#timer');
    if(s) s.textContent='0:'+String(Math.max(0,org.left)).padStart(2,'0');
    if(b) b.style.width=(100*org.left/45)+'%';
    if(t && org.left<=10) t.classList.add('low');
    if(org.left<=0) finishOrganize(false);
  },1000);
  timers.push(tick);
  const docs=document.querySelectorAll('.doc');
  docs.forEach(d=>{
    let sx=0,sy=0,drag=null,moved=false;
    d.addEventListener('pointerdown',e=>{ if(org.over) return; sx=e.clientX; sy=e.clientY; moved=false; try{d.setPointerCapture(e.pointerId);}catch(_){} });
    d.addEventListener('pointermove',e=>{
      if(org.over || !d.hasPointerCapture || !d.hasPointerCapture(e.pointerId)) return;
      if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>10){ moved=true; selectDoc(d.dataset.doc); drag=d.cloneNode(true); drag.classList.add('drag'); drag.removeAttribute('id'); document.body.appendChild(drag); }
      if(drag){ drag.style.left=e.clientX+'px'; drag.style.top=e.clientY+'px'; hoverFolder(e.clientX,e.clientY); }
    });
    const end=e=>{
      if(drag){ const f=folderAt(e.clientX,e.clientY); drag.remove(); drag=null; hoverFolder(-1,-1); if(f) fileDoc(d.dataset.doc,f); }
      else if(!moved && e.type==='pointerup'){ selectDoc(org.sel===d.dataset.doc?null:d.dataset.doc); sfx('tap'); }
      moved=false;
    };
    d.addEventListener('pointerup',end); d.addEventListener('pointercancel',end);
    d.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') selectDoc(d.dataset.doc); });
  });
  document.querySelectorAll('.folder').forEach(f=>f.addEventListener('click',()=>{ if(org.sel) fileDoc(org.sel,f.dataset.folder); else toast('Pick a document first!'); }));
}
function selectDoc(id){
  org.sel=id;
  document.querySelectorAll('.doc').forEach(x=>x.classList.toggle('sel',x.dataset.doc===id));
  document.querySelectorAll('.folder').forEach(x=>x.classList.toggle('armed',!!id));
}
function folderAt(x,y){ const el=document.elementFromPoint(x,y); const f=el&&el.closest&&el.closest('.folder'); return f?f.dataset.folder:null; }
function hoverFolder(x,y){ const k=folderAt(x,y); document.querySelectorAll('.folder').forEach(f=>f.classList.toggle('hover',f.dataset.folder===k)); }
function fileDoc(id,folder){
  if(org.over) return;
  const d=DOCS.find(x=>x.id===id), el=$('#doc-'+id);
  if(!d||!el||el.classList.contains('filed')) return;
  if(d.type===folder){
    el.classList.add('filed'); org.filed++; org.correct++; org.counts[folder]++;
    const c=$('#cnt-'+folder); if(c) c.textContent=org.counts[folder];
    const f=$('#folder-'+folder); if(f){ f.classList.remove('ok'); void f.offsetWidth; f.classList.add('ok'); }
    sfx('ok'); selectDoc(null);
    const h=$('#orghint'); if(h) h.textContent=`${org.filed} / 6 filed — keep going!`;
    if(org.filed>=DOCS.length) setTimeout(()=>finishOrganize(true),450);
  } else {
    sfx('bad'); el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
    const name={contracts:'a contract',evidence:'evidence',emails:'an email'}[d.type];
    const h=$('#orghint'); if(h) h.textContent=`Hmm — that one is ${name}. Try another folder!`;
  }
}
function finishOrganize(all){
  if(!org||org.over) return; org.over=true; clearTimers();
  const n=org.correct, perfect=n===DOCS.length;
  S.missions.organize=true;
  const xp=n*10, coins=n*15+(perfect?0:0), rep=perfect?2:0;
  const ups=addXP(xp); addCoins(coins); S.rep+=rep; S.dayStats.rep+=rep; save();
  track('mission_complete',{mission:'organize_files',score:n,time_left:Math.max(0,org.left)});
  showReward({title:perfect?'Perfectly organized!':'Time’s up!',sub:perfect?`All 6 files sorted with ${Math.max(0,org.left)}s to spare.`:`You sorted ${n} of 6 files.`,xp,coins,rep,cases:0,ups,icon:'doc',back:'law'});
}

    if(S.created && S.career) go('home'); else if(S.created) go('career'); else { onbIdx=0; go(S.onbDone?'char':'onb'); } },

  onbskip(){ S.onbDone=true; save(); go('char'); },
  'back-onb'(){ onbIdx=ONB.length-1; go('onb'); },
  av(el){ sfx('tap'); const k=el.dataset.k, v=el.dataset.v; S.av[k]= (k==='skin'||k==='hair'||k==='look')?+v:v; go('char'); },
  charok(){ const n=(S.name||'').trim();
    if(!n){ nameErr=true; sfx('bad'); go('char'); const i=$('#nm'); if(i) i.focus(); return; }
    nameErr=false; S.name=n; S.created=true; save();
    track('character_created',{skin:S.av.skin,hair:S.av.hair,style:S.av.style,outfit:S.av.outfit}); sfx('ok'); go('career'); },
  'back-char'(){ go('char'); },
  career(el){ const c=CAREERS.find(x=>x.id===el.dataset.id);
    if(!c.open){ sfx('bad'); toast(`${c.name} is coming soon! Start as a Lawyer for now.`); return; }
    careerSel=c.id; sfx('tap'); go('career'); },
  careerok(){ if(!careerSel) return; S.career=careerSel; save(); track('career_selected',{career:careerSel}); sfx('ok'); go('home'); setTimeout(()=>toast('Welcome to Sunset Bay! Tap Start Day.'),300); },
  startday(){ startDay(); sfx('ok'); track('day_start',{day:1}); toast('Day 1 started! Head to the Law Firm.'); go('map'); },
  tomap(){ sfx('tap'); go('map'); },
  tohome(){ sfx('tap'); go('home'); },
  tolaw(){ sfx('tap'); startDay(); go('law'); },
  toskills(){ sfx('tap'); go('skills'); },
  skillsback(){ go(prev && prev!=='skills' && SCREENS[prev] && !['case','org'].includes(prev) ? prev : 'home'); },
  place(el){ const p=PLACES.find(x=>x.id===el.dataset.id);
    if(!(p.open||S.level>=p.lvl)){ sfx('bad'); toast(`${p.name} unlocks at Level ${p.lvl}.`); return; }
    if(p.id==='home') go('home'); else { startDay(); go('law'); } },
  job(el){ const id=el.dataset.id;
    if(S.energy<ENERGY_COST){ toast('Out of energy — rest at home to recharge.'); return; }
    S.energy-=ENERGY_COST; save(); sfx('tap'); go(id==='clause'?'case':'org'); },
  answer(el){ const i=+el.dataset.i, a=CASE.answers[i]; caseAttempts++;
    if(a.ok){
      el.classList.add('right'); document.querySelectorAll('.ans').forEach(b=>b.disabled=true); sfx('ok');
      const first=!S.missions.clause; S.missions.clause=true;
      let ups=0, xp=0, coins=0, rep=0, cases=0;
      if(first){ xp=120; coins=250; rep=5; cases=1; ups=addXP(xp); addCoins(coins); S.rep+=rep; S.dayStats.rep+=rep; S.caseWins+=1; S.dayStats.cases+=1; }
      if(S.dayStarted) S.goals.case=true; save();
      track('mission_complete',{mission:'missing_clause',attempts:caseAttempts});
      timers.push(setTimeout(()=>showReward({title:'Case won!',sub:'Smart move — checking the clause and evidence first protects your client.',xp,coins,rep,cases,ups,icon:'trophy',back:'law'}),500));
    } else {
      el.classList.add('wrong'); el.disabled=true; sfx('bad');
      $('#fb').innerHTML=`<div class="feedback bad">${ic('close')}<span>${a.fb} Try again!</span></div>`;
    } },
  orgquit(){ if(org && !org.over){ org.over=true; S.energy=Math.min(S.maxEnergy,S.energy+ENERGY_COST); save(); } go('law'); },
  rewardok(){ closeOverlay(); go(rewardBack); },
  rewardskill(){ closeOverlay(); go('skills'); },
  upgrade(el){ const id=el.dataset.id, lv=S.skills[id], cost=100*lv;
    if(S.coins<cost){ sfx('bad'); toast('Not enough coins — win cases to earn more!'); return; }
    S.coins-=cost; S.skills[id]=lv+1; const ups=addXP(20); const firstSkill=!S.goals.skill; if(S.dayStarted) S.goals.skill=true; save();
    sfx('coin'); go('skills');
    const card=$('#sk-'+id); if(card) card.classList.add('flash');
    const nm=SKILLS.find(s=>s.id===id).name;
    toast(ups?`Level up! You reached Level ${S.level}!`:(firstSkill&&S.dayStarted?`${nm} Lv ${lv+1}! Goal complete — now go home.`:`${nm} is now Lv ${lv+1}! (+20 XP)`));
    if(ups) confetti(); },
  endday(){ sfx('ok'); showEndDay(); },
  enddayok(){ S.day1Done=true; S.day=2; save(); closeOverlay(); showPaywall(); },
  paywall(){ showPaywall(); },
  checkout(){ track('checkout_click',{price:4.99,currency:'USD',product:'founders_pass'});
    if(HOTMART_CHECKOUT_URL.indexOf('PLACEHOLDER')>-1){ track('waitlist_click',{price:4.99}); toast('The Founder\'s Pass opens in a few days. Thanks for your interest — keep playing!'); return; }
    try{ window.open(HOTMART_CHECKOUT_URL,'_blank','noopener'); }catch(e){}
    toast('Checkout opened in a new tab — thank you for supporting Dreamelle!'); },
  maybelater(){ closeOverlay(); if(cur!=='home') go('home'); else go('home'); },
  settings(){ sfx('tap'); showSettings(); },
  disclaimer(){ showDisclaimer(); },
  closeov(){ closeOverlay(); },
  tog(el){ const k=el.dataset.k; S.settings[k]=!S.settings[k]; save(); applySettings();
    el.classList.toggle('on',S.settings[k]); el.setAttribute('aria-checked',S.settings[k]);
    if(k==='music') music(S.settings.music); sfx('tap'); },
  reset(el){ if(!resetArm){ resetArm=true; el.textContent='Tap again to confirm'; return; }
    store.del(SAVE_KEY); const keep=S.settings; S=fresh(); S.settings=keep; save(); closeOverlay(); careerSel=null; onbIdx=0; go('splash'); toast('Progress reset.'); },
  rotok(){ document.body.classList.add('rot-ok'); }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const f=A[el.dataset.a]; if(f){ e.preventDefault(); f(el,e); }
});
document.addEventListener('click',e=>{ if(e.target.id==='overlay' && !$('.paywall') && !$('.reward') && !$('.endday')) closeOverlay(); });

/* ===== Boot ===== */
load(); applySettings();
try{ setTimeout(()=>Doll.preload([Doll.ART.scenes.C01_quarto,Doll.ART.scenes.C02_mapa,Doll.ART.scenes.C03_escritorio,Doll.ART.scenes.C04_casa].concat(Doll.ART.busts, Object.values(Doll.ART.poses[+(S.av.look||0)]))),400); }catch(e){}
if(S.created && S.career) careerSel=S.career;
go('splash');
window.Dreamelle={get state(){return S;}, go, showPaywall, HOTMART_CHECKOUT_URL};
})();

</script>

</body></html>
