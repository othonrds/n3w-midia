<body><h1>Dreamelle · criativos (1080×1350, EN)</h1><p>C01–C10: jogo atual (telas reais) · K1–K6: teste de conceitos (modos em desenvolvimento, com aviso “coming soon”) · status: aguardando revisão</p><main><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/9a764003-8cb0-44e7-866a-aa28b1731c2b.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/9a764003-8cb0-44e7-866a-aa28b1731c2b.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | nostalgia | C01 | v1</b><span>The doll games you loved grew up.</span><small>Se a nostalgia de jogos de boneca da infância puxa mulheres adultas, CTR de link > 1,5%.</small><em>The doll games you loved as a kid just grew up. Create her, pick a career and live the dream life in Sunset Bay — free to start, right in your browser.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c01" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/31dc6402-7607-4da9-bf99-c900640b236c.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/31dc6402-7607-4da9-bf99-c900640b236c.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | carreira-quiz | C02 | v1</b><span>Would you make a good lawyer?</span><small>Se o desafio de carreira (quiz) gera curiosidade, CTR > 1,5% e boa taxa de game_start.</small><em>A supplier missed a deadline and your client needs you. Would you make a good lawyer? Solve your first case in Sunset Bay — free to play in your browser.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c02" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/f65ab918-25df-4a78-b7d4-75437e83aba6.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/f65ab918-25df-4a78-b7d4-75437e83aba6.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | identidade | C03 | v1</b><span>Which one are you?</span><small>Se a escolha de identidade (6 looks) gera engajamento e cliques, CTR > 1,5% e comentários.</small><em>A, B, C, D, E or F? Pick your look and start your dream life in Sunset Bay. Free to start, no download needed.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c03" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/79e21789-9f4b-4cb6-afd8-5575498f5abe.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/79e21789-9f4b-4cb6-afd8-5575498f5abe.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | escolha-look | C04 | v1</b><span>Pick her look. Live her life.</span><small>Se mostrar a criação de personagem real converte melhor que promessa abstrata, custo por game_start < média.</small><em>Pick her look, give her a name and start her story. 6 looks to start — more unlock as you play. Free to start in your browser.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c04" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/1095fed7-34d1-4b22-9098-f315ec646283.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/1095fed7-34d1-4b22-9098-f315ec646283.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | dream-life | C05 | v1</b><span>Your dream life starts on Day 1.</span><small>Se a fantasia de rotina (trabalho, casa, metas) atrai, CTR > 1,2% com boa retenção até day1_complete.</small><em>Go to work, win a case, level up and go home to your dream apartment by the sea. Your dream life starts on Day 1. Free to start.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c05" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/d7df0bd2-4c6b-42b9-9923-7a78cd012248.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/d7df0bd2-4c6b-42b9-9923-7a78cd012248.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | carreira-fantasia | C06 | v1</b><span>Pick your dream career.</span><small>Se a variedade de carreiras atrai (com Lawyer jogável e as demais em breve), CTR > 1,5%.</small><em>Lawyer, model, doctor, chef, pilot… Start as a lawyer today — more careers are coming soon. Free to start in your browser.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c06" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/ac4564fc-444d-4c4c-aa31-23fff46583a2.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/ac4564fc-444d-4c4c-aa31-23fff46583a2.jpg" alt=""></a><figcaption><b>[A] DREAMELLE | falha-desafio | C07 | v1</b><span>She almost lost her first case.</span><small>Se o gancho de erro + desafio ('can you do better?') gera curiosidade, CTR > 1,8%.</small><em>She almost lost her first case. Can you get it right on the first try? Play the case free in your browser.</em><a class="l" href="https://dreamelle.vercel.app/?utm_source=meta&utm_campaign=f1&utm_content=c07" target="_blank">abrir destino</a></figcaption></figure><figure><a href="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/4c450e6f-6b4c-4802-a119-990465e2f0c5.jpg" target="_blank"><img loading="lazy" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38lL1t3zHzVQDjU5qT29V8iXM0u/4c450e6f-6b4c-48
