name: Midia job (ffmpeg)
on:
  workflow_dispatch:
    inputs:
      script:
        description: caminho do script bash no repo
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-roboto >/dev/null
      - name: run
        run: bash "${{ inputs.script }}"
      - name: commit
        run: |
          git config user.name n3w-bot
          git config user.email n3w-bot@users.noreply.github.com
          git add -A
          git commit -m "midia-job: ${{ inputs.script }}" || echo nada
          git push
