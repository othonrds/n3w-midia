<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="robots" content="noindex">
<title>Junta-Junta · Kit Foco</title><link rel="stylesheet" href="../jogo.css">
<style>
#b{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#232846;padding:8px;border-radius:14px;touch-action:none;max-width:400px;margin:10px auto}
#b div{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font:900 26px system-ui,sans-serif;background:#2c3257;color:#141414}
</style></head>
<body><div class="w">
<div class="top"><a href="../index.html">‹ Kit</a><div class="hud"><span>★ <b id="s">0</b></span><span>Recorde <b id="rec">–</b></span></div></div>
<p class="mute center" style="margin:0">Deslize para juntar números iguais. Chegue ao 2048!</p>
<div id="b"></div>
<p class="center"><button class="btn sec" id="new">Recomeçar</button></p>
<div id="end" class="screen hidden" style="min-height:0"><h1 id="endt">Sem jogadas!</h1><button class="btn" id="again">Jogar de novo</button></div>
</div>
<script src="../jogo.js"></script>
<script>
var g,score,el=KF.$('#b'),cells=[];
var CL={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#ffd23f'};
for(var i=0;i<16;i++){var d=document.createElement('div');el.appendChild(d);cells.push(d);}
KF.$('#rec').textContent=KF.best('junta')??'–';
function add(){var e=[];g.forEach(function(v,i){if(!v)e.push(i)});if(e.length)g[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4;}
function draw(){g.forEach(function(v,i){var c=cells[i];c.textContent=v||'';c.style.background=v?(CL[v]||'#3c3a32'):'#2c3257';c.style.color=v>4?'#fff':'#141414';c.style.fontSize=v>=1024?'20px':'26px';});KF.$('#s').textContent=score;}
function line(idx){var a=idx.map(function(i){return g[i]}).filter(Boolean),out=[];
  for(var i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;i++;}else out.push(a[i]);}
  while(out.length<4)out.push(0);var moved=false;idx.forEach(function(k,j){if(g[k]!==out[j])moved=true;g[k]=out[j];});return moved;}
function move(dir){var moved=false;for(var r=0;r<4;r++){var idx=[0,1,2,3].map(function(c){
    return dir==='l'?r*4+c:dir==='r'?r*4+3-c:dir==='u'?c*4+r:(3-c)*4+r;});if(line(idx))moved=true;}
  if(moved){add();draw();KF.best('junta',score);KF.$('#rec').textContent=KF.best('junta');
    if(g.indexOf(2048)>=0&&!g.won){g.won=1;KF.$('#endt').textContent='Você chegou ao 2048!';KF.$('#end').classList.remove('hidden');}
    if(over()){KF.$('#endt').textContent='Sem jogadas! '+score+' pontos';KF.$('#end').classList.remove('hidden');}}}
function over(){if(g.indexOf(0)>=0)return false;for(var i=0;i<16;i++){if(i%4<3&&g[i]===g[i+1])return false;if(i<12&&g[i]===g[i+4])return false;}return true;}
function start(){g=Array(16).fill(0);score=0;add();add();draw();KF.$('#end').classList.add('hidden');}
var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});
el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));});
document.addEventListener('keydown',function(e){var k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];if(k){e.preventDefault();move(k)}});
KF.$('#new').onclick=start;KF.$('#again').onclick=start;start();
</script></body></html>
