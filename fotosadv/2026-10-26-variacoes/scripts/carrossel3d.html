<meta charset=utf-8><style>
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:P;color:#fff;background:#0b0e1c}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 52%,#26305a 0,#121630 45%,#0b0e1c 80%)}
#ring{position:absolute;left:50%;top:1040px;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;
 border:3px solid rgba(242,201,76,.35);transform:rotateX(78deg);box-shadow:0 0 60px rgba(242,201,76,.25)}
#ring2{position:absolute;left:50%;top:1040px;width:720px;height:720px;margin:-360px 0 0 -360px;border-radius:50%;
 border:2px dashed rgba(242,201,76,.25);transform:rotateX(78deg)}
#stage{position:absolute;left:0;top:290px;width:1080px;height:880px;perspective:1400px;perspective-origin:50% 40%}
.card{position:absolute;left:50%;top:40px;width:540px;height:690px;margin-left:-270px;border-radius:28px;overflow:hidden;
 box-shadow:0 30px 70px rgba(0,0,0,.6);-webkit-box-reflect:below 18px linear-gradient(transparent 70%,rgba(255,255,255,.18));transform-style:preserve-3d}
.card img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.card .gl{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%)}
.card .bd{position:absolute;inset:0;border-radius:28px;border:4px solid #f2c94c;opacity:0}
.pt{position:absolute;border-radius:50%;background:#f2c94c}
#t{position:absolute;top:56px;left:40px;right:40px;text-align:center}
#t1{font-size:60px;font-weight:700;line-height:1.05}
#t2{font-size:84px;font-weight:700;line-height:1.05;color:#f2c94c}
#t3{font-size:34px;font-weight:500;margin-top:10px}
#b{position:absolute;bottom:64px;left:40px;right:40px;text-align:center;font-size:44px;font-weight:700}
</style>
<div id=bg></div><div id=ring></div><div id=ring2></div><div id=pts></div>
<div id=stage></div>
<div id=t><div id=t1>Ensaio profissional completo</div><div id=t2>por R$ 49,00</div><div id=t3>Escolha sua profissão, envie uma selfie, e pronto!</div></div>
<div id=b>Fotos geradas pra sua profissão específica!</div>
<script>
const S='file:///tmp/claude-0/-home-claude/2f44adb6-ce98-5299-b573-36ff38b1a7de/scratchpad/var5/src/';
const fotos=['mulher','homem','sofa','senhora'], N=fotos.length, STEP=2.0, HOLD=1.15, LOOP=N*STEP;
const st=document.getElementById('stage');
const cards=fotos.map(f=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<img src="${S}${f}.png"><div class=gl></div><div class=bd></div>`;st.appendChild(c);return c});
// partículas determinísticas
const P=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pts=document.getElementById('pts');
for(let i=0;i<34;i++){const d=document.createElement('div');d.className='pt';const s=2+rnd()*5;d.style.width=d.style.height=s+'px';pts.appendChild(d);P.push({d,x:rnd()*1080,y:rnd()*1350,sp:1+Math.floor(rnd()*2),a:rnd()*6.28,o:.2+rnd()*.5})}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
window.render=function(t){
 t=t%LOOP; const k=Math.floor(t/STEP), f=t-k*STEP, m=f<HOLD?0:ease((f-HOLD)/(STEP-HOLD)); const s=k+m;
 cards.forEach((c,i)=>{
  let d=((i-s)%N+N)%N; if(d>=N/2) d-=N;            // d em [-2,2)
  const ad=Math.abs(d);
  const x=d*400, z=-ad*330, ry=-d*38, sc=1-ad*0.08, op=Math.max(0,Math.min(1,(2-ad)*1.6));
  c.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${ry}deg) scale(${sc})`;
  c.style.opacity=op; c.style.zIndex=String(100-Math.round(ad*10)); c.style.filter=`brightness(${1-ad*0.35})`;
  const front=ad<0.5; const g=c.querySelector('.gl'), bd=c.querySelector('.bd');
  const gp=f<HOLD? Math.min(1,f/0.9):1; g.style.transform=`translateX(${front?(-120+240*gp):-120}%)`;
  bd.style.opacity=front?Math.max(0,1-ad*2)*(f<HOLD?1:1-m):0;
 });
 const ring=document.getElementById('ring'); ring.style.transform=`rotateX(78deg) rotateZ(${t/LOOP*360}deg)`;
 document.getElementById('ring2').style.transform=`rotateX(78deg) rotateZ(${-t/LOOP*360}deg)`;
 P.forEach(p=>{const ph=t/LOOP*6.283*p.sp+p.a; const y=((p.y-t/LOOP*1350*p.sp)%1350+1350)%1350;
  p.d.style.left=(p.x+Math.sin(ph)*20)+'px'; p.d.style.top=y+'px'; p.d.style.opacity=p.o*(0.6+0.4*Math.sin(ph*2))});
 const pulse=1+0.04*Math.max(0,Math.sin(Math.PI*Math.min(1,f/0.6)))*(f<0.6?1:0);
 document.getElementById('t2').style.transform=`scale(${pulse})`;
}
window.T0=999; window.DUR=LOOP;
</script>
