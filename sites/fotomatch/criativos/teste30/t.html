<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0}
.top{position:absolute;left:70px;right:70px;top:80px}
.tag{display:inline-block;font:700 26px Inter;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:12px;background:rgba(255,255,255,.14)}
.hook{font:800 76px/1.06 Poppins;margin-top:28px;letter-spacing:-.01em;text-wrap:balance}
.hook em{font-style:normal;color:#ffd166}
.mid{position:absolute;left:70px;right:70px;bottom:185px;top:500px;display:flex;align-items:center;justify-content:center}
.foot{position:absolute;left:70px;right:70px;bottom:70px;display:flex;justify-content:space-between;align-items:center}
.cta{background:#ff5a4e;color:#fff;font:800 36px Poppins;padding:24px 38px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.brand{font:700 30px Inter;opacity:.8}
/* phone */
.ph{width:560px;height:100%;background:#fff;color:#111;border-radius:48px;border:12px solid #111;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.ph .hd{padding:22px 26px;border-bottom:1px solid #eee;font:700 26px Inter;display:flex;gap:14px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f6a,#fc6);flex:none}
.ch{flex:1;padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end;background:#f4f4f6}
.b{max-width:80%;padding:14px 20px;border-radius:24px;font:500 25px/1.3 Inter}
.b.me{align-self:flex-end;background:#ff5a4e;color:#fff;border-bottom-right-radius:6px}
.b.her{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seen{align-self:flex-end;font:500 19px Inter;color:#888}
.mark{outline:5px solid #ffd166;outline-offset:4px}
.ex{position:absolute;top:16px;right:16px;font:700 16px Inter;color:#999;letter-spacing:.1em}
.stamp{position:absolute;transform:rotate(-12deg);border:7px solid #ff3b30;color:#ff3b30;font:900 52px Poppins;padding:6px 26px;border-radius:14px;background:rgba(255,255,255,.85)}
.cardp{width:600px;height:100%;border-radius:36px;overflow:hidden;background:#222;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.notif{width:760px;display:flex;flex-direction:column;gap:20px}
.nt{background:rgba(255,255,255,.95);color:#111;border-radius:26px;padding:24px 28px;display:flex;gap:18px;align-items:center;font:600 28px Inter;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.nt i{width:60px;height:60px;border-radius:16px;background:#ff5a4e;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:34px}
.nt small{display:block;font:500 22px Inter;color:#666}
.big{font:900 200px/1 Poppins;color:#ffd166}
</style></head><body><div id="r"></div><script>
const S=window.SPEC;const R=document.getElementById('r');
const bgs={A:'linear-gradient(160deg,#4a2a24,#140d0b)',B:'linear-gradient(160deg,#1d3550,#0b121b)',C:'linear-gradient(160deg,#3b2a5a,#120c1d)',D:'linear-gradient(160deg,#1f4a33,#0a1810)',E:'linear-gradient(160deg,#5a4520,#1a1408)',F:'linear-gradient(160deg,#5a2440,#1a0b13)'};
const chat=(name,msgs,extra='')=>`<div class="ph" style="position:relative"><div class="ex">EXEMPLO</div><div class="hd"><div class="av"></div>${name}</div><div class="ch">${msgs.map(m=>m[0]==='s'?`<div class="seen">${m[1]}</div>`:`<div class="b ${m[0]==='m'?'me':'her'} ${m[2]?'mark':''}">${m[1]}</div>`).join('')}</div>${extra}</div>`;
const profile=(lines,photo)=>`<div class="cardp"><div style="position:absolute;inset:0;background:${photo||'linear-gradient(180deg,#7a8a99,#3a4550)'}"></div><div class="ex" style="color:#fff">EXEMPLO</div><div style="position:absolute;left:0;right:0;bottom:0;padding:34px;background:linear-gradient(transparent,rgba(0,0,0,.85));font:500 26px/1.4 Inter">${lines}</div></div>`;
const notifs=a=>`<div class="notif">${a.map(x=>`<div class="nt"><i>${x[0]}</i><div>${x[1]}<small>${x[2]||''}</small></div></div>`).join('')}</div>`;
const M={
chat,profile,notifs,
custom:h=>h
};
let mid=S.mid; 
R.innerHTML=`<div class="bg" style="background:${bgs[S.t]}"></div><div class="top"><span class="tag">${S.tag}</span><div class="hook">${S.hook}</div></div><div class="mid">${mid}</div><div class="foot"><span class="brand">FotoMatch</span><span class="cta">${S.cta}</span></div>`;
</script></body></html>
