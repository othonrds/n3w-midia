<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sua página de advocacia · Juris Páginas</title>
<meta name="description" content="Sua página profissional de advocacia já está pronta. Envie uma selfie, veja as suas fotos de autoridade e coloque no ar por R$ 97 (1 ano).">
<meta property="og:title" content="Sua página de advocacia já está pronta">
<meta property="og:description" content="Veja agora, com o seu nome. Dentro do Provimento 205/2021 da OAB.">
<meta name="theme-color" content="#0F141B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style id="lpcss"></style>
<style>
:root{--ink:#0F141B;--gold:#C5A26B;--paper:#FBF8F3;--ok:#1F8F55;--bad:#B3261E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);font:15px/1.5 "Manrope",system-ui,sans-serif;color:#1d232b;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
/* barra superior do funil */
.fx{position:sticky;top:0;z-index:30;background:rgba(15,20,27,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;padding:10px 16px 9px;border-bottom:1px solid rgba(255,255,255,.08)}
.fx .row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto}
.fx .url{font:600 12px/1.2 ui-monospace,Menlo,monospace;color:#E9D8B4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fx .url small{display:block;font:500 10px/1.3 "Manrope",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:2px}
.steps{display:flex;gap:4px;flex:none}
.steps i{display:block;width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.steps i.on{background:var(--gold)}
.dica{max-width:1100px;margin:7px auto 0;font-size:12px;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:6px}
.dica b{color:#fff;font-weight:600}
.dica[hidden]{display:none}
/* barra inferior com a ação da etapa */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid rgba(0,0,0,.08);box-shadow:0 -12px 40px rgba(0,0,0,.18);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tx{flex:1;min-width:0;font-size:13px;line-height:1.35;color:#4b525b}
.bar .tx b{display:block;color:var(--ink);font-size:14px}
.btn{appearance:none;border:0;cursor:pointer;background:var(--ink);color:#fff;font:700 15px/1 "Manrope",sans-serif;padding:16px 18px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;flex:none;min-height:50px}
.btn.gold{background:var(--gold);color:#17120A}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(0,0,0,.18)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn svg{width:18px;height:18px;fill:currentColor}
.blk{display:flex;width:100%}
/* carregando fotos */
.gen{position:fixed;inset:0;z-index:60;background:rgba(10,13,18,.9);display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.gen[hidden]{display:none}
.gen .ring{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--gold);margin:0 auto 20px;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.gen h3{font:500 28px/1.15 "Cormorant Garamond",serif;margin:0 0 8px}
.gen p{margin:0;color:rgba(255,255,255,.7);font-size:14px}
/* checkout */
.modal{position:fixed;inset:0;z-index:70;background:rgba(10,13,18,.6);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));position:relative}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h3{padding-right:84px;font:500 30px/1.1 "Cormorant Garamond",serif;margin:0 0 4px;color:var(--ink)}
.sheet .sub{margin:0 0 16px;color:#5a6068;font-size:14px}
.x{position:absolute;top:12px;right:12px;border:0;background:#f1f2f4;border-radius:20px;padding:7px 12px;font:600 12px "Manrope",sans-serif;cursor:pointer}
.offer{border:1px solid var(--ink);border-radius:12px;padding:16px;margin-bottom:12px}
.offer .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.offer .t b{font-size:15px;color:var(--ink)}
.offer .pr{font:600 30px/1 "Cormorant Garamond",serif;color:var(--ink);white-space:nowrap}
.offer .pr small{display:block;font:600 10px/1.3 "Manrope",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7a7f86;text-align:right}
.offer ul{margin:12px 0 0;padding:0;list-style:none;font-size:13.5px;color:#3d434b}
.offer li{padding:4px 0 4px 22px;position:relative}
.offer li:before{content:"";position:absolute;left:2px;top:10px;width:10px;height:6px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.sheet label.bump{display:flex;gap:12px;align-items:flex-start;border:1.5px dashed var(--gold);background:#FBF6EC;border-radius:12px;padding:14px;margin-bottom:16px;cursor:pointer}
.bump input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.bump b{display:block;color:var(--ink);font-size:14px}
.bump span{font-size:13px;color:#5a6068}
.sheet label{display:block;font-weight:600;font-size:13px;margin:0 0 12px;color:var(--ink)}
.sheet label small{font-weight:400;color:#7a7f86}
.sheet input[type=email],.sheet input[inputmode=tel]{display:block;width:100%;margin-top:6px;font:16px "Manrope",sans-serif;padding:13px 12px;border:1px solid #cfd4da;border-radius:10px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 0;border-top:1px solid #eceef1;margin-top:4px;color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:4px 0 8px}
.note{font-size:12.5px;color:#6b7179;margin:12px 0 0;line-height:1.5}
.qr{text-align:center}
.qr img,.qr .ph{width:220px;height:220px;margin:6px auto 10px;display:grid;place-items:center;border:1px solid #e4e7ea;border-radius:12px;font-size:12px;color:#7a7f86}
.code{font:12px/1.4 ui-monospace,Menlo,monospace;background:#f4f5f7;border-radius:8px;padding:10px;word-break:break-all;text-align:left;margin:8px 0 12px;max-height:84px;overflow:auto}
.wait{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#5a6068;margin:14px 0 6px}
.wait i{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.live{font:600 14px ui-monospace,Menlo,monospace;background:#EEF7F1;color:#155C37;border-radius:10px;padding:12px;margin:10px 0 14px;text-align:center;word-break:break-all}
.sheet .btn+.btn{margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tag{display:inline-block;font:600 10px/1 "Manrope",sans-serif;letter-spacing:.1em;text-transform:uppercase;background:#FFF3D6;color:#7A5300;padding:4px 7px;border-radius:4px;margin-left:6px;vertical-align:2px}
</style>
<script src="px.js"></script>
</head><body>
<div class="fx" id="fx">
  <div class="row"><div class="url"><small>Prévia da sua página<span class="tag" id="modo" hidden>teste</span></small><span id="url">jurispaginas.com/seu-nome</span></div>
    <div class="steps" aria-label="Etapa" id="steps"><i></i><i></i><i></i></div></div>
  <p class="dica" id="dica">✎ <span><b>Toque no seu nome</b> para corrigir como ele aparece.</span></p>
</div>

<div class="lp t-premium emb" id="lp"></div>

<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<input type="file" id="selfie" accept="image/*" capture="user" class="sr" aria-label="Enviar selfie">

<div class="gen" id="gen" hidden><div><div class="ring"></div><h3>Criando suas fotos de autoridade</h3><p>Usamos a sua selfie para montar retratos profissionais.<br>Leva poucos segundos.</p></div></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script type="module" src="app.js"></script>
</body></html>
